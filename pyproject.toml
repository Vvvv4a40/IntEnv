[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "envi-assistant"
version = "0.1.0"
description = "A personal Windows assistant with Groq and allowlisted actions"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
envi = "envi.__main__:main"

[tool.setuptools.packages.find]
include = ["envi*"]
